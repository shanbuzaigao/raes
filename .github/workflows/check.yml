name: Checks

# Runs the same command I run locally before every commit: the public file list, links,
# JSON and syntax, the unit tests, and the offline replay of the synthetic example.
# It needs no secret and calls no model.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Files, tests and offline replay
        run: python -B tools/check_repository.py
